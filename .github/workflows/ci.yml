name: Continuous Integration

on:
  push:
    branches:
    - master

  pull_request:
    branches:
    - master

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v5
      with:
        persist-credentials: false
    - uses: cachix/install-nix-action@v31
      with:
        github_access_token: ${{ secrets.GITHUB_TOKEN }}

    - name: Lint
      run: nix develop --command bash -c
        "cmake -D FORMAT_COMMAND=clang-format -P cmake/lint.cmake"

    - name: Spell check
      if: always()
      run: nix develop --command bash -c
        "cmake -P cmake/spell.cmake"

  coverage:
    needs: [lint]

    runs-on: ubuntu-latest

    if: github.repository_owner == 'joelbenway'

    steps:
    - uses: actions/checkout@v5
      with:
        persist-credentials: false
    - uses: cachix/install-nix-action@v31
      with:
        github_access_token: ${{ secrets.GITHUB_TOKEN }}

    - name: Configure
      run: nix develop --command bash -c
        "cmake --preset=ci-coverage"

    - name: Build
      run: nix develop --command bash -c
        "cmake --build build/coverage -j 2"

    - name: Test
      working-directory: build/coverage
      run: nix develop --command bash -c
        "ctest --output-on-failure --no-tests=error -j 2"

    - name: Process coverage info
      run: nix develop --command bash -c
        "cmake --build build/coverage -t coverage"

    - name: Submit to codecov.io
      uses: codecov/codecov-action@v7
      with:
        disable_search: true
        files: build/coverage/coverage.info
        token: ${{ secrets.CODECOV_TOKEN }}

  sanitize:
    needs: [lint]

    runs-on: ubuntu-latest

    env: { CXX: clang++-19 }

    steps:
    - uses: actions/checkout@v5
      with:
        persist-credentials: false
    - uses: cachix/install-nix-action@v31
      with:
        github_access_token: ${{ secrets.GITHUB_TOKEN }}

    - name: Configure
      run: nix develop --command bash -c
        "cmake --preset=ci-sanitize"

    - name: Build
      run: nix develop --command bash -c
        "cmake --build build/sanitize -j 2"

    - name: Test
      working-directory: build/sanitize
      env:
        ASAN_OPTIONS: "strict_string_checks=1:\
          detect_stack_use_after_return=1:\
          check_initialization_order=1:\
          strict_init_order=1:\
          detect_leaks=1"
        UBSAN_OPTIONS: print_stacktrace=1
      run: nix develop --command bash -c
        "ctest --output-on-failure --no-tests=error -j 2"

  test:
    needs: [lint]

    strategy:
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]

        type: [shared, static]

        include:
        - { type: shared, shared: YES }
        - { type: static, shared: NO }

    runs-on: ${{ matrix.os }}

    steps:
    - uses: actions/checkout@v5
      with:
        persist-credentials: false

    - name: Install Nix
      if: matrix.os == 'ubuntu-latest'
      uses: cachix/install-nix-action@v31
      with:
        github_access_token: ${{ secrets.GITHUB_TOKEN }}

    - name: Configure Ubuntu
      if: matrix.os == 'ubuntu-latest'
      run: nix develop --command bash -c 
        "cmake --preset=ci-ubuntu
        -D BUILD_SHARED_LIBS=${{ matrix.shared }} -Wno-error=dev"

    - name: Build on Ubuntu
      if: matrix.os == 'ubuntu-latest'
      run: nix develop --command bash -c
        "cmake --build build --config Release -j 2"

    - name: Install on Ubuntu
      if: matrix.os == 'ubuntu-latest'
      run: nix develop --command bash -c
        "cmake --install build --config Release --prefix prefix"

    - name: Setup MultiToolTask
      if: matrix.os == 'windows-latest'
      run: |
        Add-Content "$env:GITHUB_ENV" 'UseMultiToolTask=true'
        Add-Content "$env:GITHUB_ENV" 'EnforceProcessCountAcrossBuilds=true'

    - name: Configure Windows and Mac
      if: matrix.os != 'ubuntu-latest'
      shell: pwsh
      run: cmake "--preset=ci-$("${{ matrix.os }}".split("-")[0])"
        -D BUILD_SHARED_LIBS=${{ matrix.shared }} -Wno-error=dev -Wno-dev

    - name: Setup PATH
      if: matrix.os == 'windows-latest' && matrix.type == 'shared'
      run: Add-Content "$env:GITHUB_PATH" "$(Get-Location)\build\Release"

    - name: Build on Windows and Mac
      if: matrix.os != 'ubuntu-latest'
      run: cmake --build build --config Release -j 2

    - name: Install on Windows and Mac
      if: matrix.os != 'ubuntu-latest'
      run: cmake --install build --config Release --prefix prefix

    - name: Move DLL for Windows Shared
      if: matrix.os == 'windows-latest' && matrix.type == 'shared'
      shell: pwsh
      run: Copy-Item -Path "build\Release\lob.dll" 
        -Destination "build\test\Release\lob.dll" -Force

    - name: Test
      working-directory: build
      run: ctest --output-on-failure --no-tests=error -C Release -j 2

  lobber:
    needs: [lint]

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v5
      with:
        persist-credentials: false
    - uses: cachix/install-nix-action@v31
      with:
        github_access_token: ${{ secrets.GITHUB_TOKEN }}

    - name: Build and test lobber
      run: nix build .#lobber

  docs:
    needs: [sanitize, test]

    runs-on: ubuntu-latest

    if: github.repository_owner == 'joelbenway'
      && github.ref == 'refs/heads/master'
      && github.event_name == 'push'

    permissions:
      contents: read
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
      
    steps:
    - uses: actions/checkout@v4
    - uses: cachix/install-nix-action@v31
      with:
        github_access_token: ${{ secrets.GITHUB_TOKEN }}

    - name: Build docs
      run: nix develop --command bash -c 
        "cmake -DPROJECT_SOURCE_DIR=$PWD -DPROJECT_BINARY_DIR=$PWD/build
        -P cmake/docs-ci.cmake"

    - name: Upload docs
      uses: actions/upload-pages-artifact@v3
      with:
        path: build/docs/html

    - name: Deploy docs to GitHub Pages
      uses: actions/deploy-pages@v4
      id: deployment

  benchmark:
    needs: [sanitize, test]
    runs-on: ubuntu-24.04

    steps:
    - name: Checkout head
      uses: actions/checkout@v5
      with:
        path: head
        persist-credentials: false

    # Same-runner base/head: a stored baseline drifts with glibc IFUNC picks.
    - name: Checkout base
      if: github.event_name == 'pull_request'
      uses: actions/checkout@v5
      with:
        ref: ${{ github.event.pull_request.base.sha }}
        path: base
        persist-credentials: false

    - name: Install Nix
      uses: cachix/install-nix-action@v31
      with:
        github_access_token: ${{ secrets.GITHUB_TOKEN }}

    - name: Build and measure head
      working-directory: head
      run: nix develop . --command bash -c
        "cmake --preset=ci-benchmark &&
         cmake --build build/benchmark -j 2 -t cachegrind-bench"

    - name: Build and measure base
      if: github.event_name == 'pull_request'
      continue-on-error: true
      working-directory: base
      run: nix develop ../head --command bash -c
        "cmake --preset=ci-benchmark &&
         cmake --build build/benchmark -j 2 -t cachegrind-bench"

    - name: Compare
      if: github.event_name == 'pull_request'
      run: cmake
        -D CG_BASE=base/build/benchmark/cachegrind/lob_bench.results.cmake
        -D CG_HEAD=head/build/benchmark/cachegrind/lob_bench.results.cmake
        -D CG_MAX_REGRESSION_BP=100
        -D "CG_THRESHOLD_OVERRIDE_build_zero_search=300"
        -D CG_SUMMARY="$GITHUB_STEP_SUMMARY"
        -P head/cmake/cachegrind-compare.cmake

    # Raw .out files for local `cg_annotate --diff` drill-down.
    - name: Upload raw cachegrind output
      if: always()
      uses: actions/upload-artifact@v3
      with:
        name: cachegrind-raw-${{ github.run_id }}
        path: |
          head/build/benchmark/cachegrind/*.out
          head/build/benchmark/cachegrind/*.json
          head/build/benchmark/cachegrind/*.results.cmake
          base/build/benchmark/cachegrind/*.out
          base/build/benchmark/cachegrind/*.results.cmake
        if-no-files-found: warn
        retention-days: 14

  track:
    needs: [benchmark]
    if: github.event_name == 'push' && github.repository_owner == 'joelbenway'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@v5
    - name: Install Nix
      uses: cachix/install-nix-action@v31
      with:
        github_access_token: ${{ secrets.GITHUB_TOKEN }}

    - name: Build and measure
      run: nix develop . --command bash -c
        "cmake --preset=ci-benchmark &&
         cmake --build build/benchmark -j 2 -t cachegrind-bench"

    - uses: benchmark-action/github-action-benchmark@v1
      with:
        name: lob instruction counts
        tool: customSmallerIsBetter
        output-file-path: build/benchmark/cachegrind/lob_bench.json
        github-token: ${{ secrets.GITHUB_TOKEN }}
        auto-push: true
        alert-threshold: '102%'
        comment-on-alert: true
        fail-on-alert: false
