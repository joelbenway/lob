name: "CLA Assistant"

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write
  issues: write

jobs:
  cla-assistant:
    runs-on: ubuntu-latest
    steps:
      - name: "CLA Assistant"
        if: (github.event.comment.body == 'recheck' || github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA') || github.event_name == 'pull_request_target'
        uses: contributor-assistant/github-action@v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PERSONAL_ACCESS_TOKEN: ${{ secrets.CLA_ACCESS_TOKEN || secrets.GITHUB_TOKEN }}
        with:
          path-to-signatures: 'signatures/version-1.0/cla.json'
          path-to-document: 'https://github.com/joelbenway/lob/blob/master/CLA.md'
          branch: 'cla-signatures'
          allowlist: 'joelbenway,bot*,*bot*,dependabot[bot],coderabbitai[bot],github-actions[bot]'
          empty-commit-flag: false
          origin-server-name: 'github.com'
