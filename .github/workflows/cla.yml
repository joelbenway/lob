name: "CLA Assistant"

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, synchronize, reopened, closed]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write
  issues: write

jobs:
  cla-assistant:
    if: >-
      (github.event_name == 'pull_request_target' &&
       (github.event.action != 'closed' || github.event.pull_request.merged == true)) ||
      (github.event_name == 'issue_comment' &&
       github.event.issue.pull_request &&
       github.event.comment.user.login != 'github-actions[bot]' &&
       (contains(github.event.comment.body, 'recheck') ||
        contains(github.event.comment.body, 'I have read the CLA Document and I hereby sign the CLA')))
    runs-on: ubuntu-latest
    steps:
      - name: "CLA Assistant"
        uses: contributor-assistant/github-action@ca4a40a7d1004f18d9960b404b97e5f30a505a08 # v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-signatures: 'signatures/version-1.0/cla.json'
          path-to-document: 'https://github.com/joelbenway/lob/blob/master/CLA.md'
          branch: 'cla-signatures'
          allowlist: 'joelbenway,dependabot[bot],coderabbitai[bot],github-actions[bot]'
